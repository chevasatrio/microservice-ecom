version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: user-service-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      - DB_HOST=user-service-db
      - DB_DATABASE=user_service_db
      - DB_USERNAME=root
      - DB_PASSWORD=
    networks:
      - laravel-net
    depends_on:
      - db

  # Nginx Web Server
  nginx:
    image: nginx:stable-alpine
    container_name: user-service-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-net

  # MySQL Database
  db:
    image: mysql:8
    container_name: user-service-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: user_service_db
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - user_db_data:/var/lib/mysql
    networks:
      - laravel-net

networks:
  laravel-net:
    external: true

volumes:
  user_db_data: